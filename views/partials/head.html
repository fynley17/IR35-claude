<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{meta.title}}</title>
  <meta name="description" content="{{meta.description}}" />
  <meta name="robots" content="{{robots}}" />
  <link rel="canonical" href="{{canonical}}" />
  <meta name="theme-color" content="#080808" />
  <meta name="color-scheme" content="dark" />
  <meta name="google-site-verification" content="ySfNszEWZX_uaSqFJ0CvvRAaYF7RGl__Bb5VMdUmUTU" />

  <meta property="og:type" content="{{#if meta.published}}article{{else}}website{{/if}}" />
  <meta property="og:site_name" content="{{business.tradingName}}" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:title" content="{{meta.title}}" />
  <meta property="og:description" content="{{meta.description}}" />
  <meta property="og:url" content="{{canonical}}" />
  <meta property="og:image" content="{{baseUrl}}/img/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="IR35 Checker — contract risk report" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{meta.title}}" />
  <meta name="twitter:description" content="{{meta.description}}" />
  <meta name="twitter:image" content="{{baseUrl}}/img/og.png" />

  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/geist-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/site.css?v={{v}}" />
  {{#if schema}}<script type="application/ld+json">{{{schema}}}</script>{{/if}}
  {{#if plausible}}<script defer data-domain="{{plausible}}" src="https://plausible.io/js/script.js"></script>{{/if}}
</head>
